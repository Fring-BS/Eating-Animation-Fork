plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}

group = project.mod_group_id

version = "${project.minecraft_display_version}+${project.mod_version}"

base {
    archivesName = 'Eating-Animation-Fork-NeoForge'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version

    runs {
        client {
            client()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_credits            : mod_credits,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xlint:deprecation'
}

jar {
    manifest {
        attributes([
                "Specification-Title"   : project.mod_id,
                "Specification-Vendor"  : project.mod_authors,
                "Specification-Version" : "1",
                "Implementation-Title"  : project.mod_name,
                "Implementation-Version": project.version,
                "Implementation-Vendor" : project.mod_authors
        ])
    }
    def archiveBaseName = base.archivesName.get()
    from("LICENSE") {
        rename { String fileName -> "${fileName}_${archiveBaseName}" }
    }
}

java {
    withSourcesJar()
}
